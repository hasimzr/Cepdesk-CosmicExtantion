[package]
name = "cepdesk-applet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CepDesk service management applet for COSMIC"
homepage = "https://cepdesk.hasimozer.com"
repository = "https://github.com/hasimzr/Cepdesk-CosmicExtantion"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic.git", rev = "dbc62f2d899cdbfbe43d170689ddc0290db663f4", default-features = false, features = ["applet", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = false
opt-level = 2
strip = true

[profile.dev]
debug = 0
incremental = false
